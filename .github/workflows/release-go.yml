name: Release / Go

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix (e.g. 4.0.0 or 4.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-go
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: libs/go/v${{ inputs.version }}

jobs:
  release:
    name: Test, verify, and tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify version matches version.go
        run: |
          package_version="$(awk -F'"' '/^const Version = / { print $2 }' version.go)"
          test "$VERSION" = "$package_version" || {
            echo "input version $VERSION does not match version.go $package_version" >&2
            exit 1
          }
      - name: Verify module path major version
        run: |
          module="$(go list -m)"
          major="${VERSION%%.*}"
          case "$module" in
            */v"$major") ;;
            *)
              echo "module path $module does not end in /v$major for version $VERSION" >&2
              exit 1
              ;;
          esac
      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
