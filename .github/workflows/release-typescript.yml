name: Release / TypeScript

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix (e.g. 4.0.0 or 4.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-typescript
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: typescript/v${{ inputs.version }}

jobs:
  release:
    name: Test, publish to npm, and tag
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@targon/sdk
    defaults:
      run:
        working-directory: libs/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: libs/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Verify version matches package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$package_version" || {
            echo "input version $VERSION does not match package.json $package_version" >&2
            exit 1
          }
      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
      - name: Inspect package
        run: npm pack --dry-run
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          npm publish --access public --tag "$dist_tag"
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
