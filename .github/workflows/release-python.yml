name: Release / Python


on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix (e.g. 4.0.0 or 4.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-python
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: python/v${{ inputs.version }}

jobs:
  release:
    name: Test, publish to PyPI, and tag
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/targon-sdk
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: libs/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: libs/python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sandbox]"
          python -m pip install build packaging twine
      - name: Test
        run: python -m pytest tests
      - name: Verify version matches package version
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from packaging.version import Version
          from targon.version import __version__

          requested = os.environ["VERSION"]
          if Version(requested) != Version(__version__):
              raise SystemExit(
                  f"input version {requested!r} does not match package {__version__!r}"
              )
          PY
      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/python/dist
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
